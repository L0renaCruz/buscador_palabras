<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Palabras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Buscador de palabras</h1>
    <textarea id="texto" placeholder="Escribe o pega tu texto aquí..."></textarea>
    <input type="text" id="busqueda" placeholder="Palabras a buscar (usa comas)">
    <button id="btnBuscar">Buscar</button>
    <p id="resultado"></p>
    <div id="textoResaltado"></div>
  </div>

  <script src="bundle.js"></script>
</body>
</html>
